name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Releases are signed with the project's release key, so each one installs over the last
      # and Play Protect sees a named developer instead of the generic Android debug key.
      - name: Restore release key
        if: github.event_name == 'push'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 is missing; a release signed with another key would not install over the app."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.jks

      - name: ktlint check
        run: ./gradlew ktlintCheck

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      # Pull requests have no access to the key, so they only check that a debug build compiles.
      - name: Assemble debug APK
        if: github.event_name != 'push'
        run: ./gradlew assembleDebug

      - name: Assemble release APK
        if: github.event_name == 'push'
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Name the APK
        if: github.event_name == 'push'
        run: cp app/build/outputs/apk/release/app-release.apk "smart-budget-build-${{ github.run_number }}.apk"

      - name: Upload APK to the run
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: smart-budget-build-${{ github.run_number }}
          path: smart-budget-build-${{ github.run_number }}.apk

  release:
    # Every push to main publishes the APK as a GitHub Release; pull requests only build.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: smart-budget-build-${{ github.run_number }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          notes=$(printf 'Commit %s\n\n%s\n\nInstall: download the APK on the phone and open it. It updates the existing app and keeps your data.' "${GITHUB_SHA::7}" "$COMMIT_MESSAGE")
          gh release create "build-${{ github.run_number }}" \
            "smart-budget-build-${{ github.run_number }}.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Smart Budget build ${{ github.run_number }}" \
            --notes "$notes" \
            --latest
